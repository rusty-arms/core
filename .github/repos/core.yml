# safe-settings overrides for core, the admin repo (ADMIN_REPO=core).
# core holds docs and config only: no code, no game data.

repository:
  description: >-
    Rusty Arms coordination: research, decisions, clean-room policy, roadmap
    and org settings as code. No game data.
  topics:
    - clean-room
    - documentation
    - safe-settings

# Same main ruleset as suborgs/clean-code.yml; keep the two in step.
rulesets:
  - name: main
    target: branch
    enforcement: active
    # Only the admins team may bypass.
    bypass_actors:
      - name: admins
        actor_type: Team
        bypass_mode: always
    conditions:
      ref_name:
        include: ["~DEFAULT_BRANCH"]
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: pull_request
        parameters:
          required_approving_review_count: 1
          require_code_owner_review: true
          dismiss_stale_reviews_on_push: true
          require_last_push_approval: false
          required_review_thread_resolution: false
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          required_status_checks:
            # Posted by .github/workflows/guard.yml (job name "guard").
            - context: guard
