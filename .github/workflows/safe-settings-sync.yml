# Runs a safe-settings full sync from GitHub Actions, based on
# github/safe-settings docs/github-action.md.
#
# Applies the config whenever it changes on main. Run it by hand (dry run by
# default) to preview, or to revert drift made outside this repo.
#
# There is no dry run on pull requests: a full sync reads the config from the
# default branch through the API, not from the checkout, so a PR run would
# only preview main.
name: safe-settings sync

on:
  push:
    branches: [main]
    paths:
      - .github/settings.yml
      - .github/suborgs/**
      - .github/repos/**
      - .github/workflows/safe-settings-sync.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (FULL_SYNC_NOP): report changes without applying them"
        type: boolean
        default: true

# Never run two syncs at once; a newer push waits for the running one.
concurrency:
  group: safe-settings-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  safe-settings-sync:
    runs-on: ubuntu-latest
    env:
      # Tag of github/safe-settings to run, and the commit it points to.
      SAFE_SETTINGS_VERSION: "3.0.0"
      SAFE_SETTINGS_CODE_DIR: ${{ github.workspace }}/.safe-settings-code
    steps:
      # Self-checkout of the admin repo (core) for the safe-settings config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Checkout of safe-settings itself, pinned to the 3.0.0 commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: github/safe-settings
          ref: a9a1f366ad6a738b55682d346d94f8d6c4893b09  # 3.0.0
          path: ${{ env.SAFE_SETTINGS_CODE_DIR }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0

      - run: npm install
        working-directory: ${{ env.SAFE_SETTINGS_CODE_DIR }}

      - run: npm run full-sync
        working-directory: ${{ env.SAFE_SETTINGS_CODE_DIR }}
        env:
          GH_ORG: ${{ vars.SAFE_SETTINGS_GH_ORG }}
          APP_ID: ${{ vars.SAFE_SETTINGS_APP_ID }}
          PRIVATE_KEY: ${{ secrets.SAFE_SETTINGS_PRIVATE_KEY }}
          GITHUB_CLIENT_ID: ${{ vars.SAFE_SETTINGS_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.SAFE_SETTINGS_GITHUB_CLIENT_SECRET }}
          ADMIN_REPO: core
          CONFIG_PATH: .github
          # Probot logs only warnings and errors by default; info prints the
          # dry-run summary of planned changes.
          LOG_LEVEL: info
          # Pushes apply for real; manual runs follow the dry_run input.
          FULL_SYNC_NOP: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
