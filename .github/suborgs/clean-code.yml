# safe-settings suborg: the clean-room code repos.
# Each repo must exist before safe-settings can configure it.

suborgrepos:
  - specs
  - engine
  - tools
  - agent-kit

rulesets:
  - name: main
    target: branch
    enforcement: active
    # Only the admins team may bypass.
    bypass_actors:
      - name: admins
        actor_type: Team
        bypass_mode: always
    conditions:
      ref_name:
        include: ["~DEFAULT_BRANCH"]
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: pull_request
        parameters:
          required_approving_review_count: 1
          require_code_owner_review: true
          dismiss_stale_reviews_on_push: true
          require_last_push_approval: false
          required_review_thread_resolution: false
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          required_status_checks:
            # Posted by .github/workflows/guard.yml (job name "guard").
            - context: guard

  # Placeholder. The "oracle" status will be posted by the local oracle
  # runner, using its own token that agents cannot read. Agents must never
  # be able to post this status, or they could fake it.
  # Kept disabled until the oracle runner exists; a required check that is
  # never posted would block every merge. Switch to "active" in a PR that
  # an admin approves once the runner is posting the status.
  - name: oracle
    target: branch
    enforcement: disabled
    bypass_actors:
      - name: admins
        actor_type: Team
        bypass_mode: always
    conditions:
      ref_name:
        include: ["~DEFAULT_BRANCH"]
        exclude: []
    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          required_status_checks:
            - context: oracle
