# safe-settings: org-wide defaults for every repo in the rusty-arms org.
# Syntax follows github/safe-settings docs/sample-settings/settings.yml
# (checked against safe-settings 3.0.0, 2026-10-18).
#
# - On GitHub Free, rulesets apply only to PUBLIC repos, so every repo in
#   this org stays public. A private repo would silently lose its ruleset.
# - Secrets never go in this YAML (or any YAML in this repo). Use Actions
#   secrets and variables.
# - safe-settings only configures repos that already exist. Create a repo
#   first, then add it here (or to a suborg) in a PR.
# - Precedence: .github/repos/*.yml > .github/suborgs/*.yml > this file.

repository:
  private: false
  visibility: public
  has_issues: true
  has_projects: false
  has_wiki: false
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: false
  delete_branch_on_merge: true
  allow_update_branch: true

labels:
  include:
    - name: clean-room
      color: "#B60205"
      description: Touches the clean-room policy or wall
    - name: spec
      color: "#1D76DB"
      description: Format or behaviour spec work
    - name: oracle
      color: "#5319E7"
      description: Dolphin oracle, golden traces or the oracle check
    - name: co-op
      color: "#0E8A16"
      description: Online or local co-op
    - name: remaster
      color: "#FBCA04"
      description: Remaster polish (HD, widescreen, frame rate, controls)
    - name: needs-ed
      color: "#D93F0B"
      description: Needs a decision or review from the owner
  # safe-settings deletes labels that are not listed above. Keep GitHub's
  # default labels.
  exclude:
    - name: "^(bug|documentation|duplicate|enhancement|good first issue|help wanted|invalid|question|wontfix)$"

# Teams. admins: the owner and anyone trusted with org settings; code owner
# for every repo. developers: people who push code.
teams:
  - name: admins
    permission: admin
    visibility: closed
  - name: developers
    permission: push
    visibility: closed

# No `rulesets:` here. safe-settings applies rulesets in this file as
# ORGANIZATION rulesets, which need the GitHub Team plan (the first dry run
# failed with "Upgrade to GitHub Team"). On Free, the `main` ruleset is
# repeated per repo instead: in suborgs/clean-code.yml and repos/core.yml.
# Every new repo needs one of those (a repo may match only one suborg).
